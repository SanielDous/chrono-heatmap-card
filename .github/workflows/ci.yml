name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:demo
      - uses: actions/upload-artifact@v4
        with:
          name: chrono-heatmap-card
          path: dist/chrono-heatmap-card.js
          retention-days: 14

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin

  screenshots:
    name: Screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm screenshots
      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: screenshots
          path: |
            screenshots/
            playwright-report/
          retention-days: 14
      - name: Comment on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.upload.outputs.artifact-url != '' }}
        uses: actions/github-script@v8
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const marker = '<!-- chrono-heatmap-screenshots -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const icon = process.env.JOB_STATUS === 'success' ? '📸' : '⚠️';
            const body = `${marker}\n${icon} **Screenshots** for \`${sha}\`: [download artifact](${process.env.ARTIFACT_URL})\n\n` +
              `Contains every gallery card of the dev page in light/en and dark/de, plus interaction shots.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  ha-e2e:
    name: Home Assistant E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      # The image (version pinned in e2e-ha/compose.yaml) is pulled while dependencies install;
      # e2e-ha/setup.ts waits until HA answers.
      - name: Start Home Assistant
        run: |
          mkdir -p e2e-ha-run
          cp -r e2e-ha/config e2e-ha-run/config
          nohup docker compose -f e2e-ha/compose.yaml up -d > e2e-ha-run/compose-up.log 2>&1 &
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Set up Home Assistant (onboarding, statistics, history, dashboard)
        id: setup
        run: pnpm e2e:ha:setup
      - run: pnpm e2e:ha
      - name: Collect Home Assistant logs
        if: failure()
        run: |
          cat e2e-ha-run/compose-up.log || true
          docker compose -f e2e-ha/compose.yaml logs --no-color > e2e-ha-run/docker.log 2>&1 || true
          sudo cp e2e-ha-run/config/home-assistant.log e2e-ha-run/home-assistant.log || true
          sudo chmod a+r e2e-ha-run/home-assistant.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ha-e2e-logs
          path: |
            e2e-ha-run/compose-up.log
            e2e-ha-run/docker.log
            e2e-ha-run/home-assistant.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: ha-e2e-screenshots
          path: |
            e2e-ha-run/screenshots/
            e2e-ha-run/report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Comment on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.upload.outputs.artifact-url != '' }}
        uses: actions/github-script@v8
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          JOB_STATUS: ${{ job.status }}
          HA_VERSION: ${{ steps.setup.outputs.ha_version }}
        with:
          script: |
            const marker = '<!-- chrono-heatmap-ha-e2e -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const ok = process.env.JOB_STATUS === 'success';
            const version = process.env.HA_VERSION ? ` ${process.env.HA_VERSION}` : '';
            const body = `${marker}\n${ok ? '🏠' : '⚠️'} **Home Assistant${version} E2E** for \`${sha}\` ${ok ? 'passed' : 'failed'}: ` +
              `[screenshots & report](${process.env.ARTIFACT_URL})\n\n` +
              `Test dashboard in light and dark, tooltip, more-info, card picker and visual editor.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
