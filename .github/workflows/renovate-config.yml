name: Renovate config

on:
  pull_request:
    paths: [renovate.json]
  push:
    branches: [main]
    paths: [renovate.json]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: npx --yes --package renovate -- renovate-config-validator --strict
