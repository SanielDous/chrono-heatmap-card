# Minimal Home Assistant configuration for the end-to-end test.
# Onboarding, time zone, statistics, history, the dashboard resource and the dashboard are set up by
# e2e-ha/setup.ts through HA's APIs.

frontend: # also loads config, lovelace, onboarding, …
history: # also loads recorder
logbook: # used by the more-info dialog

logger:
  default: warning

input_number:
  outdoor_temperature:
    name: Outdoor temperature input
    min: -30
    max: 50
    step: 0.1
    initial: 12.3
    mode: box
  energy_meter:
    name: Energy meter input
    min: 0
    max: 1000000
    step: 0.001
    initial: 1234.567
    mode: box

input_boolean:
  front_door_open:
    name: Front door open

template:
  - sensor:
      - name: Outdoor temperature
        unique_id: chrono_e2e_outdoor_temperature
        unit_of_measurement: '°C'
        device_class: temperature
        state_class: measurement
        state: "{{ states('input_number.outdoor_temperature') | float(0) }}"
      - name: Energy meter
        unique_id: chrono_e2e_energy_meter
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: "{{ states('input_number.energy_meter') | float(0) }}"
  - binary_sensor:
      - name: Front door
        unique_id: chrono_e2e_front_door
        device_class: door
        state: "{{ is_state('input_boolean.front_door_open', 'on') }}"
