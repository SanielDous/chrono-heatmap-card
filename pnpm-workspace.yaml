# The local npm proxy only serves versions it has already cached and scanned; brand-new
# versions time out. Prefer versions that have been around for a while, and pin a few transitive packages
# to versions known to be cached. Remove a pin once the proxy serves the newer version.
minimumReleaseAge: 43200 # minutes = 30 days

overrides:
  rollup: 4.62.4
  esbuild: 0.28.2
  semver@7: 7.8.5
  ws@8: 8.21.1

onlyBuiltDependencies:
  - esbuild

# Matches the Chromium build already present locally (ms-playwright/chromium-1243).
minimumReleaseAgeExclude:
  - '@playwright/test'
  - playwright
  - playwright-core
